name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true
      # Если нужна сборка - добавьте шаги, например npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # или папка 'dist', если собираете
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
